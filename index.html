<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배고픈 도형 몬스터의 점심시간</title>
    <style>
        /* 1. 스타일 설정 (CSS) */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); /* 파스텔 톤 배경 */
            font-family: 'Jua', sans-serif; /* 귀여운 폰트 */
            touch-action: none; /* 모바일 터치 스크롤 방지 */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 클릭은 캔버스로 통과시킴 */
        }

        /* 상단 점수 및 시간 표시 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 24px;
            color: #333;
            text-shadow: 2px 2px 0px #fff;
        }

        .score-box { color: #ff6b6b; }
        .time-box { color: #4ecdc4; }

        /* 몬스터와 말풍선 컨테이너 */
        #monster-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        /* 말풍선 스타일 */
        #speech-bubble {
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            border: 3px solid #333;
            margin-bottom: 10px;
            font-size: 20px;
            color: #333;
            position: relative;
            animation: float 2s infinite ease-in-out;
            text-align: center;
            min-width: 250px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* 말풍선 꼬리 */
        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }

        /* CSS로 그린 몬스터 (외부 이미지 대신 사용) */
        .monster {
            width: 100px;
            height: 100px;
            background: #7f7fd5;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            border: 4px solid #333;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2);
        }

        .monster .eyes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .monster .eye {
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            position: relative;
            border: 2px solid #333;
        }

        .monster .eye::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .monster .mouth {
            width: 40px;
            height: 10px;
            background: #333;
            border-radius: 0 0 20px 20px;
            margin: 10px auto;
            transition: all 0.2s;
        }

        /* 몬스터 감정 표현 클래스 */
        .monster.happy { background: #ff9ff3; transform: scale(1.1) translateY(-10px); }
        .monster.happy .mouth { height: 20px; border-radius: 0 0 20px 20px; background: #d63031; }
        
        .monster.sad { background: #636e72; transform: scale(0.9); }
        .monster.sad .mouth { height: 10px; border-radius: 20px 20px 0 0; margin-top: 15px; }

        /* 게임 오버/시작 오버레이 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            pointer-events: auto;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Jua', sans-serif;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #c0392b;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* 애니메이션 키프레임 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .shake-anim { animation: shake 0.4s; }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="status-bar">
            <div class="score-box">점수: <span id="score">0</span></div>
            <div class="time-box">시간: <span id="time">60</span></div>
        </div>

        <div id="monster-container">
            <div id="speech-bubble">게임 시작 버튼을 눌러주세요!</div>
            <div class="monster" id="monster">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="mouth"></div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <h1 style="font-size: 40px; margin-bottom: 20px; text-shadow: 3px 3px 0 #333;">배고픈 도형 몬스터</h1>
        <p style="font-size: 20px; margin-bottom: 40px;">몬스터가 원하는 도형을 찾아주세요!</p>
        <button id="start-btn">게임 시작!</button>
    </div>
</div>

<script>
    /**
     * 2. 게임 로직 (JavaScript)
     * 초등 3학년 평면도형 교육 과정을 반영한 게임입니다.
     */

    // --- 캔버스 및 기본 설정 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = {
        score: document.getElementById('score'),
        time: document.getElementById('time'),
        bubble: document.getElementById('speech-bubble'),
        monster: document.getElementById('monster'),
        overlay: document.getElementById('overlay'),
        startBtn: document.getElementById('start-btn')
    };

    let width, height;
    let gameLoopId;
    let lastTime = 0;
    
    // 게임 상태 변수
    let score = 0;
    let timeLeft = 60;
    let isPlaying = false;
    let shapes = [];
    let particles = [];
    let currentMission = null; // 현재 몬스터가 원하는 도형 조건
    let spawnTimer = 0;
    let difficultyMultiplier = 1; // 시간이 지날수록 어려워짐

    // --- 오디오 시스템 (Web Audio API) ---
    // 외부 파일 없이 브라우저 자체 신디사이저로 소리를 만듭니다.
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            // 띠링! (높은 도 -> 미 -> 솔)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.linearRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.linearRampToValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            // 뿡~ (낮은 톱니파)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'pop') {
            // 뽁 (도형 등장)
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    // --- 도형 데이터 정의 ---
    const SHAPE_TYPES = [
        { id: 'circle', name: '원', sides: 0, vertices: 0, rightAngles: 0, color: '#FF7675' },
        { id: 'triangle', name: '삼각형', sides: 3, vertices: 3, rightAngles: 0, color: '#74B9FF' },
        { id: 'right_triangle', name: '직각삼각형', sides: 3, vertices: 3, rightAngles: 1, color: '#55E6C1' },
        { id: 'rectangle', name: '직사각형', sides: 4, vertices: 4, rightAngles: 4, color: '#A29BFE' }, // 네 각이 모두 직각
        { id: 'square', name: '정사각형', sides: 4, vertices: 4, rightAngles: 4, color: '#FDCB6E' }, // 네 변의 길이 같음, 네 각 직각
        { id: 'pentagon', name: '오각형', sides: 5, vertices: 5, rightAngles: 0, color: '#FD79A8' },
        { id: 'hexagon', name: '육각형', sides: 6, vertices: 6, rightAngles: 0, color: '#FAB1A0' }
    ];

    // 몬스터의 질문 목록
    const MISSIONS = [
        { text: "변이 3개인 도형을 찾아줘!", check: (s) => s.sides === 3 },
        { text: "꼭짓점이 4개인 도형을 원해!", check: (s) => s.vertices === 4 },
        { text: "직각이 있는 도형을 먹고 싶어!", check: (s) => s.rightAngles > 0 },
        { text: "직각이 4개나 있는 도형은?", check: (s) => s.rightAngles === 4 },
        { text: "변이 5개 이상인 도형을 찾아봐!", check: (s) => s.sides >= 5 },
        { text: "동글동글한 원을 찾아줘!", check: (s) => s.id === 'circle' },
        { text: "반듯한 네모 모양(사각형)을 찾아줘!", check: (s) => s.sides === 4 },
        { text: "네 변의 길이가 모두 같은 사각형은?", check: (s) => s.id === 'square' }, // 정사각형
        { text: "세 변과 세 꼭짓점이 있는 도형!", check: (s) => s.sides === 3 }
    ];

    // --- 클래스 정의 ---

    class Shape {
        constructor() {
            // 랜덤으로 도형 타입 결정 (정답 생성 확률을 조금 높임)
            const isTarget = Math.random() < 0.4 && currentMission; 
            if (isTarget) {
                // 현재 미션에 맞는 도형 찾기
                const targets = SHAPE_TYPES.filter(s => currentMission.check(s));
                this.type = targets[Math.floor(Math.random() * targets.length)];
            } else {
                this.type = SHAPE_TYPES[Math.floor(Math.random() * SHAPE_TYPES.length)];
            }
            
            this.size = Math.random() * 30 + 40; // 크기 40~70
            this.x = Math.random() * (width - 100) + 50;
            this.y = -100; // 화면 위에서 시작
            this.speedY = (Math.random() * 1 + 1.5) * difficultyMultiplier;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotationSpeed = (Math.random() - 0.5) * 0.05;
        }

        update() {
            this.y += this.speedY;
            this.rotation += this.rotationSpeed;
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.type.color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;

            ctx.beginPath();
            
            // 도형 그리기 로직
            switch(this.type.id) {
                case 'circle':
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                    break;
                case 'square': // 정사각형
                    ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                    break;
                case 'rectangle': // 직사각형 (가로가 약간 더 김)
                    ctx.rect(-this.size/2 - 10, -this.size/2, this.size + 20, this.size);
                    break;
                case 'right_triangle': // 직각삼각형
                    ctx.moveTo(-this.size/2, -this.size/2);
                    ctx.lineTo(-this.size/2, this.size/2); // 수직선
                    ctx.lineTo(this.size/2, this.size/2);  // 수평선
                    ctx.closePath();
                    // 직각 표시 (ㄱ)
                    // ctx.strokeRect(-this.size/2, this.size/2 - 10, 10, 10); // 간단 표현
                    break;
                case 'triangle': // 정삼각형
                    for(let i=0; i<3; i++) {
                        const angle = (i * 2 * Math.PI / 3) - Math.PI/2;
                        const px = Math.cos(angle) * (this.size/1.5);
                        const py = Math.sin(angle) * (this.size/1.5);
                        if(i===0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    break;
                case 'pentagon':
                    for(let i=0; i<5; i++) {
                        const angle = (i * 2 * Math.PI / 5) - Math.PI/2;
                        const px = Math.cos(angle) * (this.size/1.5);
                        const py = Math.sin(angle) * (this.size/1.5);
                        if(i===0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    break;
                case 'hexagon':
                    for(let i=0; i<6; i++) {
                        const angle = (i * 2 * Math.PI / 6);
                        const px = Math.cos(angle) * (this.size/1.5);
                        const py = Math.sin(angle) * (this.size/1.5);
                        if(i===0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    break;
            }

            ctx.fill();
            ctx.stroke();
            
            // 그림자 효과
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.restore();
        }

        // 클릭 충돌 감지 (대략적인 원형 충돌 체크)
        isClicked(mx, my) {
            const dist = Math.hypot(this.x - mx, this.y - my);
            return dist < this.size / 1.5 + 10; // 터치 영역 여유
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * 5 + 2;
            this.life = 1.0; // 투명도
        }
        update() {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.life -= 0.03;
        }
        draw(ctx) {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // --- 게임 함수 ---

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    function createExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function setNextMission() {
        const prevMission = currentMission;
        while(currentMission === prevMission) {
            currentMission = MISSIONS[Math.floor(Math.random() * MISSIONS.length)];
        }
        ui.bubble.innerText = currentMission.text;
        
        // 말풍선 애니메이션 리셋
        ui.bubble.classList.remove('shake-anim');
        void ui.bubble.offsetWidth; // 리플로우 강제
        ui.bubble.classList.add('shake-anim');
    }

    function handleInput(x, y) {
        if (!isPlaying) return;

        // 뒤에서부터 확인 (화면 앞쪽에 있는 도형부터 클릭되도록)
        for (let i = shapes.length - 1; i >= 0; i--) {
            const s = shapes[i];
            if (s.isClicked(x, y)) {
                // 정답 체크
                if (currentMission.check(s.type)) {
                    // 정답!
                    score += 10;
                    ui.score.innerText = score;
                    playSound('correct');
                    createExplosion(s.x, s.y, '#ffd700'); // 황금색 파티클
                    
                    // 몬스터 반응
                    ui.monster.classList.add('happy');
                    setTimeout(() => ui.monster.classList.remove('happy'), 500);

                    // 도형 제거 및 새 미션
                    shapes.splice(i, 1);
                    setNextMission();
                    
                    // 정답 맞출때마다 속도 약간 증가 (난이도)
                    difficultyMultiplier += 0.05;

                } else {
                    // 오답!
                    timeLeft = Math.max(0, timeLeft - 5);
                    ui.time.innerText = Math.ceil(timeLeft);
                    playSound('wrong');
                    
                    // 몬스터 반응
                    ui.monster.classList.add('sad');
                    setTimeout(() => ui.monster.classList.remove('sad'), 500);
                    
                    // 도형 흔들림 효과 (시각적 피드백)
                    createExplosion(s.x, s.y, '#555');
                }
                return; // 한 번에 하나만 클릭
            }
        }
    }

    // 입력 이벤트 리스너
    canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        // e.preventDefault(); // 기본 터치 동작 방지
        const touch = e.touches[0];
        handleInput(touch.clientX, touch.clientY);
    }, {passive: false});

    function gameLoop(timestamp) {
        if (!isPlaying) return;

        const dt = timestamp - lastTime;
        lastTime = timestamp;

        // 화면 지우기
        ctx.clearRect(0, 0, width, height);

        // 시간 감소
        timeLeft -= 0.016; // 대략 60fps 기준
        ui.time.innerText = Math.ceil(timeLeft);

        if (timeLeft <= 0) {
            gameOver();
            return;
        }

        // 도형 생성
        spawnTimer++;
        if (spawnTimer > 60) { // 약 1초마다 생성
            shapes.push(new Shape());
            playSound('pop');
            spawnTimer = 0;
        }

        // 도형 업데이트 및 그리기
        for (let i = shapes.length - 1; i >= 0; i--) {
            let s = shapes[i];
            s.update();
            s.draw(ctx);

            // 화면 밖으로 나가면 삭제
            if (s.y > height + 100) {
                shapes.splice(i, 1);
            }
        }

        // 파티클 업데이트
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.update();
            p.draw(ctx);
            if (p.life <= 0) particles.splice(i, 1);
        }

        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        score = 0;
        timeLeft = 60;
        shapes = [];
        particles = [];
        difficultyMultiplier = 1;
        isPlaying = true;
        
        ui.score.innerText = score;
        ui.overlay.style.display = 'none';
        
        setNextMission();
        lastTime = performance.now();
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isPlaying = false;
        cancelAnimationFrame(gameLoopId);
        
        // 결과 화면 표시
        ui.overlay.innerHTML = `
            <h1 style="color: #ff6b6b; font-size: 50px; margin-bottom: 20px;">게임 종료!</h1>
            <p style="font-size: 30px; margin-bottom: 30px;">총 점수: ${score}점</p>
            <p style="font-size: 20px; margin-bottom: 40px;">정말 잘했어요!</p>
            <button onclick="startGame()">다시 하기</button>
        `;
        ui.overlay.style.display = 'flex';
    }

    // 초기화 및 이벤트 연결
    ui.startBtn.addEventListener('click', () => {
        // 오디오 컨텍스트 활성화 (브라우저 정책 대응)
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        startGame();
    });

</script>
</body>
</html>
